<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">名字背后的出发点</title><desc id="desc">以具体、可理解的意象，表达 TALOS 的性格。</desc><g font-family="Inter,Noto Sans CJK SC,system-ui,sans-serif"><rect x="0" y="0" width="800" height="500" rx="0" fill="#F5F5F7" opacity="1"/><rect x="40" y="32" width="24" height="4" rx="0" fill="#FAD861" opacity="1"/><text x="76" y="40" font-size="12" fill="#17191F" font-weight="400" text-anchor="start">TALOS / 06</text><text x="40" y="108" font-size="36" fill="#17191F" font-weight="500" text-anchor="start">名字背后的出发点</text><text x="40" y="144" font-size="16" fill="#63666D" font-weight="400" text-anchor="start">以具体、可理解的意象，表达 TALOS 的性格。</text><path d="M116 216 L116 396" fill="none" stroke="#17191F" stroke-width="1.5" opacity="1"/><path d="M116 216 L292 216" fill="none" stroke="#17191F" stroke-width="1.5" opacity="1"/><path d="M292 216 L292 396" fill="none" stroke="#17191F" stroke-width="1.5" opacity="1"/><path d="M84 396 L324 396" fill="none" stroke="#17191F" stroke-width="1.5" opacity="1"/><path d="M152 396 V276 H256 V396" fill="none" stroke="#17191F" stroke-width="1.5"/><rect x="200" y="272" width="8" height="112" rx="0" fill="#FAD861" opacity="1"/><text x="388" y="228" font-size="20" fill="#17191F" font-weight="500" text-anchor="start">Talos：希腊神话中的青铜守卫</text><text x="388" y="276" font-size="18" fill="#17191F" font-weight="400" text-anchor="start">从名字出发，我们关心：</text><text x="388" y="316" font-size="18" fill="#17191F" font-weight="400" text-anchor="start">珍视个人的积累</text><text x="388" y="352" font-size="18" fill="#17191F" font-weight="400" text-anchor="start">尊重人的决定与边界</text><text x="388" y="388" font-size="18" fill="#17191F" font-weight="400" text-anchor="start">让工作留下可核对的结果</text><text x="40" y="440" font-size="14" fill="#63666D" font-weight="400" text-anchor="start">文化来源与现代品牌寓意分别说明；神话不构成产品能力证明。</text><path d="M40 460 L760 460" fill="none" stroke="#17191F" stroke-width="1.5" opacity="0.16"/><text x="40" y="484" font-size="11" fill="#63666D" font-weight="400" text-anchor="start">公开理念与系统图解 · 2026.09</text><text x="760" y="484" font-size="11" fill="#63666D" font-weight="400" text-anchor="end">TALOS · AGENT OS</text></g></svg>
