<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">从自己的工作出发</title><desc id="desc">三类场景，共用资料、上下文、任务与成果基础。</desc><g font-family="Inter,Noto Sans CJK SC,system-ui,sans-serif"><rect x="0" y="0" width="800" height="500" rx="0" fill="#F5F5F7" opacity="1"/><rect x="40" y="32" width="24" height="4" rx="0" fill="#76B0FA" opacity="1"/><text x="76" y="40" font-size="12" fill="#17191F" font-weight="400" text-anchor="start">TALOS / 02</text><text x="40" y="108" font-size="36" fill="#17191F" font-weight="500" text-anchor="start">从自己的工作出发</text><text x="40" y="144" font-size="16" fill="#63666D" font-weight="400" text-anchor="start">三类场景，共用资料、上下文、任务与成果基础。</text><text x="40" y="200" font-size="14" fill="#63666D" font-weight="400" text-anchor="start">01</text><text x="80" y="200" font-size="24" fill="#17191F" font-weight="500" text-anchor="start">资料变成果</text><text x="80" y="228" font-size="16" fill="#17191F" font-weight="400" text-anchor="start">笔记、文档、参考材料</text><path d="M352 216 L412 216" fill="none" stroke="#17191F" stroke-width="1.5" opacity="1"/><path d="M406 212 L412 216 L406 220" stroke="#17191F" fill="none" stroke-width="1.5"/><text x="436" y="224" font-size="18" fill="#17191F" font-weight="400" text-anchor="start">有依据的回答、报告与方案</text><path d="M80 248 L760 248" fill="none" stroke="#17191F" stroke-width="1.5" opacity="0.14"/><text x="40" y="280" font-size="14" fill="#63666D" font-weight="400" text-anchor="start">02</text><text x="80" y="280" font-size="24" fill="#17191F" font-weight="500" text-anchor="start">目标变交付</text><text x="80" y="308" font-size="16" fill="#17191F" font-weight="400" text-anchor="start">一个目标与相关资料</text><path d="M352 296 L412 296" fill="none" stroke="#17191F" stroke-width="1.5" opacity="1"/><path d="M406 292 L412 296 L406 300" stroke="#17191F" fill="none" stroke-width="1.5"/><text x="436" y="304" font-size="18" fill="#17191F" font-weight="400" text-anchor="start">可检查的成果、进度与下一步</text><path d="M80 328 L760 328" fill="none" stroke="#17191F" stroke-width="1.5" opacity="0.14"/><text x="40" y="360" font-size="14" fill="#63666D" font-weight="400" text-anchor="start">03</text><text x="80" y="360" font-size="24" fill="#17191F" font-weight="500" text-anchor="start">重复工作有方法</text><text x="80" y="388" font-size="16" fill="#17191F" font-weight="400" text-anchor="start">常做的任务与已确认步骤</text><path d="M352 376 L412 376" fill="none" stroke="#17191F" stroke-width="1.5" opacity="1"/><path d="M406 372 L412 376 L406 380" stroke="#17191F" fill="none" stroke-width="1.5"/><text x="436" y="384" font-size="18" fill="#17191F" font-weight="400" text-anchor="start">可复用的流程与处理记录</text><path d="M80 408 L760 408" fill="none" stroke="#17191F" stroke-width="1.5" opacity="0.14"/><text x="40" y="440" font-size="14" fill="#63666D" font-weight="400" text-anchor="start">按产品与阶段逐步实现；成果是否有用，由实际用途检验。</text><path d="M40 460 L760 460" fill="none" stroke="#17191F" stroke-width="1.5" opacity="0.16"/><text x="40" y="484" font-size="11" fill="#63666D" font-weight="400" text-anchor="start">公开理念与系统图解 · 2026.09</text><text x="760" y="484" font-size="11" fill="#63666D" font-weight="400" text-anchor="end">TALOS · AGENT OS</text></g></svg>
