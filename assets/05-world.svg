<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">TALOS World</title><desc id="desc">让积累、智能体和真实工作，进入可以共同参与的数字世界。</desc><g font-family="Inter,Noto Sans CJK SC,system-ui,sans-serif"><rect x="0" y="0" width="800" height="500" rx="0" fill="#F5F5F7" opacity="1"/><rect x="40" y="32" width="24" height="4" rx="0" fill="#76B0FA" opacity="1"/><text x="76" y="40" font-size="12" fill="#17191F" font-weight="400" text-anchor="start">TALOS / 05</text><text x="40" y="108" font-size="36" fill="#17191F" font-weight="500" text-anchor="start">TALOS World</text><text x="40" y="144" font-size="16" fill="#63666D" font-weight="400" text-anchor="start">让积累、智能体和真实工作，进入可以共同参与的数字世界。</text><rect x="40" y="180" width="720" height="48" rx="12" fill="#17191F" opacity="1"/><text x="400" y="210" font-size="18" fill="#F5F5F7" font-weight="400" text-anchor="middle">人 · 有身份和记忆的角色 · 连接真实工作的成果</text><circle cx="140" cy="310" r="28" fill="#F5F5F7" stroke="#17191F" stroke-width="1.5" stroke-dasharray="4 6"/><text x="140" y="316" font-size="20" fill="#17191F" font-weight="400" text-anchor="middle">○</text><text x="140" y="368" font-size="20" fill="#17191F" font-weight="400" text-anchor="middle">自己的积累</text><text x="140" y="398" font-size="16" fill="#63666D" font-weight="400" text-anchor="middle">资料、经验与目标</text><circle cx="400" cy="310" r="28" fill="#F5F5F7" stroke="#17191F" stroke-width="1.5" stroke-dasharray="4 6"/><text x="400" y="316" font-size="20" fill="#17191F" font-weight="400" text-anchor="middle">○</text><text x="400" y="368" font-size="20" fill="#17191F" font-weight="400" text-anchor="middle">持续的角色</text><text x="400" y="398" font-size="16" fill="#63666D" font-weight="400" text-anchor="middle">记忆、关系与协作</text><circle cx="660" cy="310" r="28" fill="#F5F5F7" stroke="#17191F" stroke-width="1.5" stroke-dasharray="4 6"/><text x="660" y="316" font-size="20" fill="#17191F" font-weight="400" text-anchor="middle">○</text><text x="660" y="368" font-size="20" fill="#17191F" font-weight="400" text-anchor="middle">共享的世界</text><text x="660" y="398" font-size="16" fill="#63666D" font-weight="400" text-anchor="middle">相遇、委托与成果</text><path d="M180 310 L356 310" fill="none" stroke="#17191F" stroke-width="1.5" opacity="1" stroke-dasharray="4 6"/><path d="M350 306 L356 310 L350 314" stroke="#17191F" fill="none" stroke-width="1.5"/><path d="M440 310 L616 310" fill="none" stroke="#17191F" stroke-width="1.5" opacity="1" stroke-dasharray="4 6"/><path d="M610 306 L616 310 L610 314" stroke="#17191F" fill="none" stroke-width="1.5"/><text x="40" y="440" font-size="14" fill="#63666D" font-weight="400" text-anchor="start">长期愿景 · 粒粒时空已有演示基础，跨节点与 UE5 世界仍待建设。</text><path d="M40 460 L760 460" fill="none" stroke="#17191F" stroke-width="1.5" opacity="0.16"/><text x="40" y="484" font-size="11" fill="#63666D" font-weight="400" text-anchor="start">公开理念与系统图解 · 2026.09</text><text x="760" y="484" font-size="11" fill="#63666D" font-weight="400" text-anchor="end">TALOS · AGENT OS</text></g></svg>
