<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">不同用途，清楚分工</title><desc id="desc">系统概览 · 名称代表各自职责，不代表全部功能已经集成。</desc><g font-family="Inter,Noto Sans CJK SC,system-ui,sans-serif"><rect x="0" y="0" width="800" height="500" rx="0" fill="#F5F5F7" opacity="1"/><rect x="40" y="32" width="24" height="4" rx="0" fill="#76B0FA" opacity="1"/><text x="76" y="40" font-size="12" fill="#17191F" font-weight="400" text-anchor="start">TALOS / 04</text><text x="40" y="108" font-size="36" fill="#17191F" font-weight="500" text-anchor="start">不同用途，清楚分工</text><text x="40" y="144" font-size="16" fill="#63666D" font-weight="400" text-anchor="start">系统概览 · 名称代表各自职责，不代表全部功能已经集成。</text><text x="40" y="192" font-size="14" fill="#63666D" font-weight="400" text-anchor="start">积累与使用</text><text x="180" y="192" font-size="20" fill="#17191F" font-weight="500" text-anchor="start">TALOS 资料库</text><text x="180" y="218" font-size="16" fill="#17191F" font-weight="400" text-anchor="start">整理资料、检索来源、保留经验</text><path d="M40 232 L760 232" fill="none" stroke="#17191F" stroke-width="1.5" opacity="0.14"/><text x="40" y="252" font-size="14" fill="#63666D" font-weight="400" text-anchor="start">观察与判断</text><text x="180" y="252" font-size="20" fill="#17191F" font-weight="500" text-anchor="start">TALOS Lens</text><text x="180" y="278" font-size="16" fill="#17191F" font-weight="400" text-anchor="start">看清数据、项目、版本与升级参考</text><path d="M40 292 L760 292" fill="none" stroke="#17191F" stroke-width="1.5" opacity="0.14"/><text x="40" y="312" font-size="14" fill="#63666D" font-weight="400" text-anchor="start">执行与审查</text><text x="180" y="312" font-size="20" fill="#17191F" font-weight="500" text-anchor="start">AO / AOR</text><text x="180" y="338" font-size="16" fill="#17191F" font-weight="400" text-anchor="start">组织任务分工、执行与独立审查</text><path d="M40 352 L760 352" fill="none" stroke="#17191F" stroke-width="1.5" opacity="0.14"/><text x="40" y="372" font-size="14" fill="#63666D" font-weight="400" text-anchor="start">进入与使用</text><text x="180" y="372" font-size="20" fill="#17191F" font-weight="500" text-anchor="start">lili · Plugin · 手机与语音</text><text x="180" y="398" font-size="16" fill="#17191F" font-weight="400" text-anchor="start">通过适合当前场景的入口协作</text><path d="M40 412 L760 412" fill="none" stroke="#17191F" stroke-width="1.5" opacity="0.14"/><text x="40" y="448" font-size="14" fill="#63666D" font-weight="400" text-anchor="start">研究、写作与三维创作等场景逐步扩展；各项目尚未全部互通。</text><path d="M40 460 L760 460" fill="none" stroke="#17191F" stroke-width="1.5" opacity="0.16"/><text x="40" y="484" font-size="11" fill="#63666D" font-weight="400" text-anchor="start">公开理念与系统图解 · 2026.09</text><text x="760" y="484" font-size="11" fill="#63666D" font-weight="400" text-anchor="end">TALOS · AGENT OS</text></g></svg>
